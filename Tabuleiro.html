        <section class="tabuleiro">

            <div class="buraco">
                <img src="img/anomaliaAzul_normal.png" alt="Xícara com a anomalia azul" class="anomalia">
            </div>

             <div class="buraco">
                <img src="img/xicara.png" alt="Xícara" class="xicara">
            </div>

            <div class="buraco">
                <img src="img/bomba.png" alt="Xícara com a bomba" class="bomba">
            </div>

        </section>

    </main>

</html>
