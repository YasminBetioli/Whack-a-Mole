<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="StyleLCP.css">
    <title> Whack-a-Anomaly | Login </title>
</head>

<body>
    <div class="login-page">

        <div class="container-login">

            <div class="secao-foto">

                <div class="foto-login">
                    <img src="/Whack-a-Mole/Img/Foto_Perfil_Login.png" alt="Personagem como foto de perfil">
                </div>
            
            </div>

            <div class="linha-divisora"></div>

            <div class="secao-formulario">
                <h1> Login </h1>

                <form>
                    <div class="campo-input-texto">
                        <label for="username"> Username </label>
                        <input type="text" id="username" name="username">
                    </div>

                    <div class="campo-input-texto">
                        <label for="senha"> Senha </label>
                        <input type="password" id="senha" name="senha">
                    </div>

                    <button type="button" onclick="window.location.href='TelaInicial.html'"> Login </button>
                </form>

                <div class="link-cadastro">
                    <span class="texto-vermelho-login"> Novo aqui? </span>
                    <a href="TelaCadastro.html"> Crie sua conta </a>
                </div>

            </div>

        </div>

        <img src="/Whack-a-Mole/Img/Canto_Inferior_Direito_Login.png" alt="Personagem decorativo">

    </div>
</body>
</html>
