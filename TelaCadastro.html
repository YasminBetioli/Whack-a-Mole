<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="StyleLCP.css">
    <title> Whack-a-Anomaly | Cadastro </title>
</head>

<body>
    <div class="cadastro-page">

        <div class="container-cadastro">

            <div class="secao-foto">

                <div class="foto-cadastro">
                    <img src="/Whack-a-Mole/Img/Foto_Perfil_Login.png" alt="Personagem como foto de perfil">
                </div>
            
            </div>

            <div class="linha-divisora"></div>

            <div class="secao-formulario">
                <h1> Cadastro </h1>

                <form>
                    <div class="campo-input-texto linha-completa">
                        <label for="nome"> Nome Completo </label>
                        <input type="text" id="nome" name="nome">
                    </div>

                    <div class="input-segunda-linha">
                        <div class="campo-input-texto metade">
                            <label for="data-nascimento"> Data de Nascimento </label>
                            <input type="text" id="data-nascimento" name="data-nascimento">
                        </div>

                        <div class="campo-input-texto metade input-com-cadeado">
                            <label for="cpf"> CPF </label>
                            <input type="text" id="cpf" name="cpf">
                        </div>
                    </div>

                    <div class="input-terceira-linha">
                        <div class="campo-input-texto metade">
                            <label for="telefone"> Telefone </label>
                            <input type="tel" id="telefone" name="telefone">
                        </div>

                        <div class="campo-input-texto metade">
                            <label for="email"> E-mail </label>
                            <input type="email" id="email" name="email">
                        </div>
                    </div>

                    <div class="input-quarta-linha">
                        <div class="campo-input-texto metade input-com-cadeado">
                            <label for="username-cadastro"> Username </label>
                            <input type="text" id="username-cadastro" name="username-cadastro">
                        </div>

                        <div class="campo-input-texto metade">
                            <label for="senha-cadastro"> Senha </label>
                            <input type="password" id="senha-cadastro" name="senha-cadastro">
                        </div>
                    </div>

                    <button type="button" onclick="window.location.href='TelaLogin.html'"> Criar conta </button>
                </form>

            </div>
            
        </div>

        <img src="/Whack-a-Mole/Img/Canto_Inferior_Direito_Login.png" alt="Personagem decorativo">

    </div>
</body>
</html>
